version: "3.9"

services:
  mysql:
    image: mysql:8.4
    container_name: routewise-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-routewise}
      MYSQL_USER: ${DB_USERNAME:-routewise}
      MYSQL_PASSWORD: ${DB_PASSWORD:-routewise}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - routewise-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: routewise-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-routewise}
      DB_USERNAME: ${DB_USERNAME:-routewise}
      DB_PASSWORD: ${DB_PASSWORD:-routewise}
      JWT_SECRET: ${JWT_SECRET:-change-this-dev-only-secret-key-must-be-long-enough-for-hs256}
      BACKEND_PORT: 8080
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8081}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-Demo@1234}
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_PROXY_TARGET: http://backend:8080
    container_name: routewise-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8081}:80"

volumes:
  routewise-mysql-data:
